name: CI

on:
  push:
    branches:
      - master
      - dev
      - feature/**
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore csharp-self-instruction.sln

      - name: Build .NET Framework 4.0
        run: dotnet build kursach.csproj -f net40 -c Release --no-restore

      - name: Build .NET 8
        run: dotnet build kursach.csproj -f net8.0-windows -c Release --no-restore

      - name: Test
        run: dotnet test csharp-self-instruction.sln -c Release --no-restore --verbosity minimal

      - name: Publish release packages
        shell: pwsh
        run: ./build/publish.ps1

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/releases/*.zip
